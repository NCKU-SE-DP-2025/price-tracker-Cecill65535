name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731] # 你的 Runner ID
    
    # 步驟 1：【關鍵修復】設定環境變數
    # 告訴 setup-python 我們的工具快取路徑，以修復 Permission denied
    env:
      RUNNER_TOOL_CACHE: /Users/cecill/Documents/actions-runner/_work/_tool

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 步驟 2：【關鍵修復】我們「必須」重新啟用 setup-python
      # 這樣我們才能取得「相容的」 Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # 步驟 3：現在 'python' 這個指令會正確指向 3.12
          python -m pip install --upgrade pip
          
          # 這裡會使用 Python 3.12，所以 'greenlet', 'orjson' 等套件會編譯成功
          pip install -r backend/requirements.txt
          
          pip install pytest pytest-mock pytest-cov
          pip install "bcrypt==4.1.3" # 強制 bcrypt 版本

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # 步驟 4：使用 'python' (3.12) 和 -m 旗標
          python -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml