name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 步驟 1：【核彈級修復】下載一個「獨立」的 Python 3.12 到當前目錄
      # 我們完全繞過你系統的 Python 3.14 和 setup-python
      - name: Setup Portable Python 3.12
        run: |
          echo "Downloading portable Python 3.12..."
          curl -L "https://github.com/actions/python-versions/releases/download/3.12.10-14343898437/python-3.12.10-darwin-arm64.tar.gz" -o python.tar.gz
          
          echo "Extracting to ./python_env..."
          mkdir -p python_env
          # 解壓縮到專案目錄下的 python_env 資料夾，這裡絕對有權限
          tar -xzf python.tar.gz -C python_env

      # 步驟 2：使用這個獨立的 Python 來安裝套件
      - name: Install dependencies
        run: |
          # 注意：我們直接指定 ./python_env/bin/python3 這個執行檔
          
          ./python_env/bin/python3 -m pip install --upgrade pip
          
          # 因為是 Python 3.12，這裡不需要編譯，直接下載 wheel，保證成功！
          ./python_env/bin/python3 -m pip install -r backend/requirements.txt
          
          ./python_env/bin/python3 -m pip install pytest pytest-mock pytest-cov
          ./python_env/bin/python3 -m pip install "bcrypt==4.1.3"

      # 步驟 3：執行測試
      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # 使用同一個獨立 python3 來跑測試
          # 注意前面的 ../ 是因為我們 cd 到了 backend
          ../python_env/bin/python3 -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml