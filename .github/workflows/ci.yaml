name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731] # 你的 Runner ID
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 這一整步是完全正確的，不要動
      - name: Manually install Python 3.12
        run: |
          echo "Installing Python 3.12 manually..."
          curl -L "https://github.com/actions/python-versions/releases/download/3.12.10-14343898437/python-3.12.10-darwin-arm64.tar.gz" -o python.tar.gz
          mkdir -p $RUNNER_TOOL_CACHE/python
          tar -xzf python.tar.gz -C $RUNNER_TOOL_CACHE/python
          echo "$RUNNER_TOOL_CACHE/python/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # 步驟 1：【關鍵修復】
          # 'python' -> 'python3'
          python3 -m pip install --upgrade pip
          
          # 'pip' -> 'python3 -m pip' (更保險的作法)
          python3 -m pip install -r backend/requirements.txt
          
          python3 -m pip install pytest pytest-mock pytest-cov
          python3 -m pip install "bcrypt==4.1.3" # 強制 bcrypt 版本

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # 步驟 2：【關鍵修復】
          # 'python' -> 'python3'
          python3 -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml