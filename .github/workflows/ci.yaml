name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 步驟 1：下載並解壓，然後「自動搜尋」Python 執行檔位置
      - name: Setup Portable Python 3.12
        run: |
          echo "Downloading portable Python 3.12..."
          curl -L "https://github.com/actions/python-versions/releases/download/3.12.10-14343898437/python-3.12.10-darwin-arm64.tar.gz" -o python.tar.gz
          
          echo "Extracting..."
          mkdir -p python_env
          tar -xzf python.tar.gz -C python_env
          
          # 【關鍵修復】不要用猜的，直接用 find 指令找出 python3 在哪裡
          # 這行會找出 python_env 底下所有的 python3 檔案，並取第一個
          PYTHON_BIN=$(find python_env -name "python3" -type f | head -n 1)
          
          if [ -z "$PYTHON_BIN" ]; then
            echo "❌ Error: Could not find python3 binary in extracted folder!"
            # 如果找不到，列出檔案結構幫忙除錯
            find python_env
            exit 1
          fi
          
          echo "✅ Found Python at: $PYTHON_BIN"
          
          # 將這個路徑寫入 GitHub Environment 變數，讓後面的步驟可以直接用 $PYTHON_EXE 呼叫
          echo "PYTHON_EXE=$PYTHON_BIN" >> $GITHUB_ENV

      # 步驟 2：使用找到的 Python 安裝套件
      - name: Install dependencies
        run: |
          # 使用我們剛剛抓到的 $PYTHON_EXE 變數
          echo "Using Python: $PYTHON_EXE"
          
          "$PYTHON_EXE" -m pip install --upgrade pip
          "$PYTHON_EXE" -m pip install -r backend/requirements.txt
          "$PYTHON_EXE" -m pip install pytest pytest-mock pytest-cov
          "$PYTHON_EXE" -m pip install "bcrypt==4.1.3"

      # 步驟 3：執行測試
      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # 同樣使用 $PYTHON_EXE
          "$PYTHON_EXE" -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml