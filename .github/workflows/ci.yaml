name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731] # 你的 Runner ID
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 我們刪除所有 'Set up Python' 步驟
      
      - name: Install dependencies
        # 步驟 1：【關鍵修復】
        # 在執行任何 python 指令前，先在 shell 中「強制」設定這個環境變數
        run: |
          export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          
          # 步驟 2：使用你 Mac 上的 python3 (3.14 版)
          python3 -m pip install --upgrade pip
          
          # 這裡現在會因為 PYO3...=1 而成功編譯
          python3 -m pip install -r backend/requirements.txt
          
          python3 -m pip install pytest pytest-mock pytest-cov
          python3 -m pip install "bcrypt==4.1.3" # 強制 bcrypt 版本

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # 步驟 3：使用 python3 和 -m 旗標
          python3 -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml