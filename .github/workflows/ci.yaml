name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74144731]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 步驟 1：下載「真正的」免安裝 Python 3.12 (來自 indygreg/python-build-standalone)
      - name: Setup Portable Python 3.12
        run: |
          echo "Downloading Standalone Python 3.12 (aarch64)..."
          # 這是專門給 Apple Silicon (M1/M2/M3) 的免安裝版
          curl -L "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-aarch64-apple-darwin-install_only.tar.gz" -o python.tar.gz
          
          echo "Extracting..."
          mkdir -p python_env
          # 這個壓縮檔解壓後會是一個 'python' 資料夾，裡面直接有 bin/python3
          tar -xzf python.tar.gz -C python_env
          
          # 自動找出 python3 執行檔的位置
          PYTHON_BIN=$(find python_env -name "python3" -type f | grep "/bin/python3$" | head -n 1)
          
          if [ -z "$PYTHON_BIN" ]; then
            echo "❌ Error: Still could not find python3 binary!"
            find python_env
            exit 1
          fi
          
          echo "✅ Found Python at: $PYTHON_BIN"
          echo "PYTHON_EXE=$PYTHON_BIN" >> $GITHUB_ENV

      # 步驟 2：使用找到的 Python 安裝套件
      - name: Install dependencies
        run: |
          echo "Using Python: $PYTHON_EXE"
          
          "$PYTHON_EXE" -m pip install --upgrade pip
          "$PYTHON_EXE" -m pip install -r backend/requirements.txt
          "$PYTHON_EXE" -m pip install pytest pytest-mock pytest-cov
          "$PYTHON_EXE" -m pip install "bcrypt==4.1.3"

      # 步驟 3：執行測試
      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          "$PYTHON_EXE" -m pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml